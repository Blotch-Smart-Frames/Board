name: Check

on:
  workflow_call:
    inputs:
      name:
        description: "Display name for the check job"
        required: true
        type: string
      command:
        description: "npm script to run"
        required: true
        type: string

jobs:
  check:
    name: ${{ inputs.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ inputs.name }}
        run: npm run ${{ inputs.command }}
