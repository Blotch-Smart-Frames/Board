name: Pull Request Checks

on:
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Angular environment.ts
        run: |
          mkdir -p packages/client/src/environments
          cat > packages/client/src/environments/environment.ts <<'EOF'
          export const environment = {
            firebase: {
              apiKey: '${{ secrets.VITE_FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.VITE_FIREBASE_APP_ID }}',
            },
            google: {
              clientId: '${{ secrets.VITE_GOOGLE_CLIENT_ID }}',
            },
          };
          EOF

      - name: Run tests
        run: npm run test:ci:coverage

      - name: Upload client coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/client/coverage/board/lcov.info
          flags: client
          disable_search: true
          fail_ci_if_error: false

      - name: Upload functions coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/functions/coverage/lcov.info
          flags: functions
          disable_search: true
          fail_ci_if_error: false

  format:
    name: Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  cspell:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run cspell
        run: npm run cspell
