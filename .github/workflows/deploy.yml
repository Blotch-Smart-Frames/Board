name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Angular environment.ts
        run: |
          mkdir -p packages/client/src/environments
          cat > packages/client/src/environments/environment.ts <<'EOF'
          export const environment = {
            firebase: {
              apiKey: '${{ secrets.VITE_FIREBASE_API_KEY }}',
              authDomain: '${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}',
              projectId: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}',
              storageBucket: '${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}',
              messagingSenderId: '${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}',
              appId: '${{ secrets.VITE_FIREBASE_APP_ID }}',
            },
            google: {
              clientId: '${{ secrets.VITE_GOOGLE_CLIENT_ID }}',
            },
          };
          EOF

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
